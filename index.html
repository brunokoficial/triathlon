<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="pngwing.com.ico" type="image/x-icon">
    <title>Triathlon</title>
</head>
<body class="home-page">

    <!-- Slideshow de Fundo -->
    <div class="bg-slideshow">
        <img src="ciclismoimg.png" alt="imagem ciclismo" class="bg-img bg-img-1">
        <img src="corridaimg.png" alt="imagem corrida" class="bg-img bg-img-2">
        <img src="ntacaoimg.png" alt="imagem natacao" class="bg-img bg-img-3">
        <img src="triathlo.png" alt="imagem triathlo" class="bg-img bg-img-4">
        <div class="bg-overlay"></div>
    </div>

    <!-- Saudação no Topo -->
    <div id="saudacao" class="welcome-msg-top"></div>

    <!-- Conteúdo Principal -->
    <div class="container">
        <header>
            <h1>TRIATHLON</h1>
            <h2>O que é?</h2>
            <p class="description">O triathlon é um esporte de resistência que combina três modalidades contínuas:</p>
        </header>

        <main>
            <nav id="modalidades">
                <ul class="horizontal-list">
                    <li><a href="corrida.html">Corrida</a></li>
                    <li><a href="natacao.html">Natação</a></li>
                    <li><a href="ciclismo.html">Ciclismo</a></li>
                </ul>
            </nav>
        </main>

        <footer>
            <p>Desenvolvido por: <strong> <a href="https://github.com/brunokoficial" target="_blank" id="bruno">Bruno Kutcher</a></strong></p>
        </footer>
    </div>

    <!-- SISTEMA DE INTERAÇÃO UNIFICADO (HTML) -->
    <div class="interaction-wrapper">
        <div class="interaction-box">
            <div class="interaction-item">
                <span id="likeCount" class="counter">0</span>
                <button id="likeBtn" class="btn-action btn-like" title="Curtir">👍</button>
            </div>
            <div class="interaction-divider"></div>
            <div class="interaction-item">
                <span id="dislikeCount" class="counter">0</span>
                <button id="dislikeBtn" class="btn-action btn-dislike" title="Descurtir">👎</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="index.js"></script>
</body>
</html>
